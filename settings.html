<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings</title>
<link rel="stylesheet" href="styles.css"><script src="data.js"></script><script src="config.js"></script><script src="app.js"></script><link rel="stylesheet" href="square-theme.css"></head><body class="square-pos"><div class="app-shell" id="shell"></div><script>if(!App.requireLogin()) throw new Error("login required");
document.getElementById("shell").innerHTML=App.shell("settings", "Settings");
document.getElementById("page").innerHTML=`
<div class="container"><div class="card"><h2>Business settings</h2><div class="grid g2"><div><label>Business name</label><input id="bn"></div><div><label>ABN</label><input id="abn"></div><div><label>Address</label><input id="address"></div><div><label>Phone</label><input id="phone"></div><div><label>Receipt footer</label><input id="footer"></div><div><label>GST rate %</label><input id="gst" type="number" step="0.1"></div></div><button class="btn btn-dark" style="margin-top:14px" onclick="save()">Save settings</button></div></div>
`;

let s=App.settings();bn.value=s.businessName||'';abn.value=s.abn||'';address.value=s.address||'';phone.value=s.phone||'';footer.value=s.receiptFooter||'';gst.value=s.gstRate||10;function save(){App.saveSettings({businessName:bn.value.trim(),abn:abn.value.trim(),address:address.value.trim(),phone:phone.value.trim(),receiptFooter:footer.value.trim(),gstRate:Number(gst.value)||10});alert('Saved. Refresh pages to see the business name update.')}
</script></body></html>
