<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Items</title>
  <link rel="stylesheet" href="styles.css">
  <script src="data.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</head>
<body>
<div class="app-shell" id="shell"></div>

<script>
if (!App.requireAdmin()) {
  throw new Error("admin required");
}

document.getElementById("shell").innerHTML = App.shell("products", "Items");

document.getElementById("page").innerHTML = `
<div class="container">

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <h2 style="margin:0">Item library</h2>
      <a class="btn" href="categories.html">Manage Categories</a>
    </div>

    <div id="itemMessage" style="margin-top:12px"></div>

    <div class="grid g4" style="margin-top:14px">
      <div>
        <label>Name</label>
        <input id="productName" placeholder="e.g. Sweet Lip">
      </div>

      <div>
        <label>Category</label>
        <select id="productCategory"></select>
      </div>

      <div>
        <label>Price</label>
        <input id="productPrice" type="number" min="0" step="0.01" placeholder="14.00">
      </div>

      <div>
        <label>&nbsp;</label>
        <button id="addItemButton" class="btn btn-dark" style="width:100%">
          Add item
        </button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="toolbar">
      <div>
        <label>Search</label>
        <input id="productSearch" placeholder="Search item library">
      </div>
    </div>

    <div style="overflow:auto">
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th>Category</th>
            <th>Price</th>
            <th>Favourite</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="productRows"></tbody>
      </table>
    </div>
  </div>

</div>
`;

const productNameEl = document.getElementById("productName");
const productCategoryEl = document.getElementById("productCategory");
const productPriceEl = document.getElementById("productPrice");
const productSearchEl = document.getElementById("productSearch");
const productRowsEl = document.getElementById("productRows");
const itemMessageEl = document.getElementById("itemMessage");
const addItemButtonEl = document.getElementById("addItemButton");

function showItemMessage(text, type = "success") {
  itemMessageEl.innerHTML = `
    <div class="notice" style="${type === "success"
      ? "background:#eaf8ef;border-color:#b9dfc4"
      : "background:#fff0f0;border-color:#efb6b6"}">
      ${text}
    </div>
  `;

  setTimeout(function () {
    itemMessageEl.innerHTML = "";
  }, 3000);
}

function fillCategories() {
  const categories = App.categories().filter(function (category) {
    return category.active !== false;
  });

  productCategoryEl.innerHTML = "";

  if (!categories.length) {
    const option = document.createElement("option");
    option.value = "";
    option.textContent = "No categories available";
    productCategoryEl.appendChild(option);
    return;
  }

  categories.forEach(function (category) {
    const option = document.createElement("option");
    option.value = category.name;
    option.textContent = category.name;
    productCategoryEl.appendChild(option);
  });
}

function addProduct() {
  const productName = productNameEl.value.trim();
  const category = productCategoryEl.value;
  const priceText = productPriceEl.value.trim();
  const price = Number(priceText);

  if (!productName) {
    showItemMessage("Please enter the item name.", "error");
    productNameEl.focus();
    return;
  }

  if (!category) {
    showItemMessage("Please select a category.", "error");
    return;
  }

  if (priceText === "" || Number.isNaN(price) || price < 0) {
    showItemMessage("Please enter a valid price.", "error");
    productPriceEl.focus();
    return;
  }

  const products = App.products();

  products.push({
    id: App.nextId(products),
    name: productName,
    category: category,
    price: price,
    active: true,
    favorite: false
  });

  App.saveProducts(products);

  productNameEl.value = "";
  productPriceEl.value = "";

  showItemMessage(productName + " added successfully.");
  renderProducts();
  productNameEl.focus();
}

function editProduct(id) {
  const products = App.products();
  const product = products.find(function (item) {
    return Number(item.id) === Number(id);
  });

  if (!product) return;

  const newName = prompt("Item name:", product.name);
  if (newName === null) return;

  const newCategory = prompt("Category:", product.category);
  if (newCategory === null) return;

  const newPriceText = prompt("Price:", product.price);
  if (newPriceText === null) return;

  const newPrice = Number(newPriceText);

  if (!newName.trim() || !newCategory.trim() || Number.isNaN(newPrice) || newPrice < 0) {
    alert("Please enter valid item details.");
    return;
  }

  product.name = newName.trim();
  product.category = newCategory.trim();
  product.price = newPrice;

  App.saveProducts(products);
  renderProducts();
}

function toggleFavourite(id) {
  const products = App.products();
  const product = products.find(function (item) {
    return Number(item.id) === Number(id);
  });

  if (!product) return;

  product.favorite = !product.favorite;
  App.saveProducts(products);
  renderProducts();
}

function toggleAvailability(id) {
  const products = App.products();
  const product = products.find(function (item) {
    return Number(item.id) === Number(id);
  });

  if (!product) return;

  product.active = product.active === false;
  App.saveProducts(products);
  renderProducts();
}

function deleteProduct(id) {
  if (!confirm("Delete this item permanently?")) return;

  const products = App.products().filter(function (item) {
    return Number(item.id) !== Number(id);
  });

  App.saveProducts(products);
  renderProducts();
}

function renderProducts() {
  const search = productSearchEl.value.trim().toLowerCase();

  const products = App.products()
    .filter(function (product) {
      return !search ||
        product.name.toLowerCase().includes(search) ||
        product.category.toLowerCase().includes(search);
    })
    .sort(function (a, b) {
      return a.category.localeCompare(b.category) ||
        a.name.localeCompare(b.name);
    });

  productRowsEl.innerHTML = "";

  products.forEach(function (product) {
    const row = document.createElement("tr");

    row.innerHTML = `
      <td><b>${product.name}</b></td>
      <td>${product.category}</td>
      <td>${App.money(product.price)}</td>
      <td>
        <button class="btn" onclick="toggleFavourite(${product.id})">
          ${product.favorite ? "★" : "☆"}
        </button>
      </td>
      <td>
        <span class="badge ${product.active === false ? "bad" : "good"}">
          ${product.active === false ? "Unavailable" : "Available"}
        </span>
      </td>
      <td>
        <button class="btn" onclick="editProduct(${product.id})">Edit</button>
        <button class="btn" onclick="toggleAvailability(${product.id})">
          ${product.active === false ? "Enable" : "Disable"}
        </button>
        <button class="btn btn-bad" onclick="deleteProduct(${product.id})">
          Delete
        </button>
      </td>
    `;

    productRowsEl.appendChild(row);
  });
}

addItemButtonEl.addEventListener("click", addProduct);
productSearchEl.addEventListener("input", renderProducts);

productPriceEl.addEventListener("keydown", function (event) {
  if (event.key === "Enter") addProduct();
});

fillCategories();
renderProducts();
</script>
</body>
</html>
