<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cashout - Indulge Cafe POS</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="data.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>

  <style>
    .cashout-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:16px;
    }
    .cashout-card{
      background:#fff;
      border:1px solid #ddd;
      border-radius:14px;
      padding:18px;
    }
    .cashout-card h2{
      margin-top:0;
    }
    .cashout-summary{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
      margin-top:12px;
    }
    .cashout-stat{
      border:1px solid #ddd;
      border-radius:10px;
      padding:12px;
      background:#fafafa;
    }
    .cashout-stat small{
      display:block;
      color:#666;
      margin-bottom:4px;
    }
    .cashout-stat strong{
      font-size:22px;
    }
    .cashout-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .cashout-table{
      width:100%;
      border-collapse:collapse;
      margin-top:12px;
    }
    .cashout-table th,
    .cashout-table td{
      padding:9px;
      border-bottom:1px solid #e5e5e5;
      text-align:left;
    }
    .noticebox{
      padding:12px;
      border-radius:10px;
      margin:12px 0;
      background:#f7f7f7;
      border:1px solid #ddd;
    }
    .ok{
      background:#eef8f1;
      border-color:#b9dfc4;
    }
    .warn{
      background:#fff8e8;
      border-color:#ead39a;
    }
    .dangerbox{
      background:#fff0f0;
      border-color:#efb6b6;
    }
    @media(max-width:900px){
      .cashout-grid,
      .cashout-summary,
      .cashout-actions{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<div class="app-shell" id="shell"></div>

<script>
if (!App.requireLogin()) {
  throw new Error("login required");
}

document.getElementById("shell").innerHTML =
  App.shell("sales", "Cashout / End of Day");

document.getElementById("page").innerHTML = `
  <div class="container">

    <div id="message"></div>

    <div class="cashout-grid">

      <section class="cashout-card">
        <h2>Register Session</h2>

        <div id="sessionStatus" class="noticebox">
          Checking register...
        </div>

        <div id="openRegisterArea">
          <label>Opening float</label>
          <input
            id="openingFloat"
            type="number"
            min="0"
            step="0.01"
            placeholder="e.g. 200.00"
          >

          <button
            id="openRegisterBtn"
            class="btn btn-dark"
            style="width:100%;margin-top:10px"
          >
            Open Register
          </button>
        </div>

        <div id="openSessionArea" style="display:none">

          <div class="cashout-summary">

            <div class="cashout-stat">
              <small>Opening float</small>
              <strong id="openingFloatView">$0.00</strong>
            </div>

            <div class="cashout-stat">
              <small>Cash sales</small>
              <strong id="cashSalesView">$0.00</strong>
            </div>

            <div class="cashout-stat">
              <small>Cash in</small>
              <strong id="cashInView">$0.00</strong>
            </div>

            <div class="cashout-stat">
              <small>Cash out</small>
              <strong id="cashOutView">$0.00</strong>
            </div>

            <div class="cashout-stat" style="grid-column:1/-1">
              <small>Expected cash in drawer</small>
              <strong id="expectedCashView">$0.00</strong>
            </div>

          </div>
        </div>
      </section>


      <section class="cashout-card">
        <h2>Cash In / Cash Out</h2>

        <div class="cashout-actions">

          <div>
            <label>Amount</label>
            <input
              id="movementAmount"
              type="number"
              min="0.01"
              step="0.01"
              placeholder="e.g. 50.00"
            >
          </div>

          <div>
            <label>Reason</label>
            <input
              id="movementReason"
              placeholder="e.g. Petty cash"
            >
          </div>

          <button
            id="cashInBtn"
            class="btn"
          >
            Cash In
          </button>

          <button
            id="cashOutBtn"
            class="btn"
          >
            Cash Out
          </button>

        </div>

        <div style="overflow:auto">
          <table class="cashout-table">
            <thead>
              <tr>
                <th>Time</th>
                <th>Type</th>
                <th>Reason</th>
                <th>Amount</th>
              </tr>
            </thead>
            <tbody id="movementRows"></tbody>
          </table>
        </div>
      </section>


      <section class="cashout-card" style="grid-column:1/-1">
        <h2>End of Day / Close Register</h2>

        <p class="muted">
          Count the physical cash in the drawer, enter the amount below,
          then close the register.
        </p>

        <div class="cashout-actions">

          <div>
            <label>Counted cash</label>
            <input
              id="countedCash"
              type="number"
              min="0"
              step="0.01"
              placeholder="Enter cash counted"
            >
          </div>

          <div>
            <label>Notes</label>
            <input
              id="closeNotes"
              placeholder="Optional note"
            >
          </div>

        </div>

        <div class="cashout-summary" style="margin-top:14px">

          <div class="cashout-stat">
            <small>Expected cash</small>
            <strong id="closeExpectedView">$0.00</strong>
          </div>

          <div class="cashout-stat">
            <small>Difference</small>
            <strong id="differenceView">$0.00</strong>
          </div>

        </div>

        <button
          id="closeRegisterBtn"
          class="btn btn-dark"
          style="width:100%;margin-top:14px"
        >
          Close Register / End of Day
        </button>

      </section>

    </div>

  </div>
`;


const messageEl = document.getElementById("message");
const sessionStatusEl = document.getElementById("sessionStatus");

const openRegisterAreaEl = document.getElementById("openRegisterArea");
const openSessionAreaEl = document.getElementById("openSessionArea");

const openingFloatEl = document.getElementById("openingFloat");
const openRegisterBtnEl = document.getElementById("openRegisterBtn");

const openingFloatViewEl = document.getElementById("openingFloatView");
const cashSalesViewEl = document.getElementById("cashSalesView");
const cashInViewEl = document.getElementById("cashInView");
const cashOutViewEl = document.getElementById("cashOutView");
const expectedCashViewEl = document.getElementById("expectedCashView");

const movementAmountEl = document.getElementById("movementAmount");
const movementReasonEl = document.getElementById("movementReason");
const cashInBtnEl = document.getElementById("cashInBtn");
const cashOutBtnEl = document.getElementById("cashOutBtn");
const movementRowsEl = document.getElementById("movementRows");

const countedCashEl = document.getElementById("countedCash");
const closeNotesEl = document.getElementById("closeNotes");
const closeExpectedViewEl = document.getElementById("closeExpectedView");
const differenceViewEl = document.getElementById("differenceView");
const closeRegisterBtnEl = document.getElementById("closeRegisterBtn");


let currentProfile = null;
let currentSession = null;
let currentExpectedCash = 0;


function money(value) {
  return App.money(Number(value || 0));
}


function showMessage(text, type = "ok") {
  messageEl.innerHTML = `
    <div class="noticebox ${type}">
      ${text}
    </div>
  `;
}


async function getCurrentProfile() {

  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();

  if (userError || !user) {
    console.error("User error:", userError);
    return null;
  }

  const {
    data: profile,
    error: profileError
  } = await supabaseClient
    .from("profiles")
    .select("id, business_id, full_name, role, active")
    .eq("id", user.id)
    .single();

  if (profileError) {
    console.error("Profile error:", profileError);
    return null;
  }

  if (profile.active === false) {
    alert("This POS user is disabled.");
    return null;
  }

  return profile;
}


async function getOpenSession() {

  const {
    data,
    error
  } = await supabaseClient
    .from("cash_sessions")
    .select("*")
    .eq("business_id", currentProfile.business_id)
    .eq("status", "open")
    .order("opened_at", { ascending: false })
    .limit(1)
    .maybeSingle();

  if (error) {
    console.error("Open session error:", error);
    throw error;
  }

  return data;
}


async function loadCashSales() {

  if (!currentSession) {
    return 0;
  }

  const {
    data,
    error
  } = await supabaseClient
    .from("orders")
    .select("total")
    .eq("business_id", currentProfile.business_id)
    .eq("status", "completed")
    .eq("payment_method", "Cash")
    .gte("created_at", currentSession.opened_at);

  if (error) {
    console.error("Cash sales error:", error);
    throw error;
  }

  return (data || []).reduce(
    (sum, order) => sum + Number(order.total || 0),
    0
  );
}


async function loadMovements() {

  if (!currentSession) {
    movementRowsEl.innerHTML =
      `<tr><td colspan="4">No open register.</td></tr>`;
    return { cashIn: 0, cashOut: 0 };
  }

  const {
    data,
    error
  } = await supabaseClient
    .from("cash_movements")
    .select("*")
    .eq("session_id", currentSession.id)
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Cash movement error:", error);
    throw error;
  }

  let cashIn = 0;
  let cashOut = 0;

  movementRowsEl.innerHTML = "";

  if (!data || !data.length) {
    movementRowsEl.innerHTML =
      `<tr><td colspan="4">No cash movements yet.</td></tr>`;
  }

  (data || []).forEach(row => {

    if (row.movement_type === "cash_in") {
      cashIn += Number(row.amount || 0);
    }

    if (row.movement_type === "cash_out") {
      cashOut += Number(row.amount || 0);
    }

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${new Date(row.created_at).toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      })}</td>
      <td>${row.movement_type === "cash_in" ? "Cash In" : "Cash Out"}</td>
      <td>${row.reason || ""}</td>
      <td>${money(row.amount)}</td>
    `;

    movementRowsEl.appendChild(tr);
  });

  return { cashIn, cashOut };
}


async function refreshRegister() {

  try {

    currentSession = await getOpenSession();

    if (!currentSession) {

      sessionStatusEl.className = "noticebox warn";
      sessionStatusEl.textContent = "Register is currently closed.";

      openRegisterAreaEl.style.display = "block";
      openSessionAreaEl.style.display = "none";

      movementRowsEl.innerHTML =
        `<tr><td colspan="4">Open the register first.</td></tr>`;

      currentExpectedCash = 0;

      closeExpectedViewEl.textContent = money(0);
      differenceViewEl.textContent = money(0);

      return;
    }

    openRegisterAreaEl.style.display = "none";
    openSessionAreaEl.style.display = "block";

    sessionStatusEl.className = "noticebox ok";
    sessionStatusEl.innerHTML = `
      Register open since
      <strong>${new Date(currentSession.opened_at).toLocaleString()}</strong>
    `;

    const cashSales = await loadCashSales();
    const movements = await loadMovements();

    const openingFloat = Number(currentSession.opening_float || 0);

    currentExpectedCash =
      openingFloat +
      cashSales +
      movements.cashIn -
      movements.cashOut;

    openingFloatViewEl.textContent = money(openingFloat);
    cashSalesViewEl.textContent = money(cashSales);
    cashInViewEl.textContent = money(movements.cashIn);
    cashOutViewEl.textContent = money(movements.cashOut);
    expectedCashViewEl.textContent = money(currentExpectedCash);
    closeExpectedViewEl.textContent = money(currentExpectedCash);

    updateDifference();

  } catch (error) {

    console.error(error);

    showMessage(
      "Could not load the register information. " +
      (error.message || ""),
      "dangerbox"
    );
  }
}


async function openRegister() {

  const openingFloat = Number(openingFloatEl.value);

  if (!Number.isFinite(openingFloat) || openingFloat < 0) {
    alert("Enter a valid opening float.");
    return;
  }

  try {

    const existing = await getOpenSession();

    if (existing) {
      alert("A register session is already open.");
      currentSession = existing;
      await refreshRegister();
      return;
    }

    const {
      data,
      error
    } = await supabaseClient
      .from("cash_sessions")
      .insert({
        business_id: currentProfile.business_id,
        opened_by: currentProfile.id,
        opening_float: openingFloat,
        status: "open"
      })
      .select()
      .single();

    if (error) {
      throw error;
    }

    currentSession = data;

    openingFloatEl.value = "";

    showMessage("Register opened successfully.");

    await refreshRegister();

  } catch (error) {

    console.error("Open register error:", error);

    alert(
      "Could not open the register.\n\n" +
      (error.message || "Unknown error")
    );
  }
}


async function addMovement(movementType) {

  if (!currentSession) {
    alert("Open the register first.");
    return;
  }

  const amount = Number(movementAmountEl.value);
  const reason = movementReasonEl.value.trim();

  if (!Number.isFinite(amount) || amount <= 0) {
    alert("Enter a valid amount.");
    return;
  }

  if (!reason) {
    alert("Enter a reason.");
    return;
  }

  try {

    const {
      error
    } = await supabaseClient
      .from("cash_movements")
      .insert({
        business_id: currentProfile.business_id,
        session_id: currentSession.id,
        movement_type: movementType,
        amount: amount,
        reason: reason,
        created_by: currentProfile.id
      });

    if (error) {
      throw error;
    }

    movementAmountEl.value = "";
    movementReasonEl.value = "";

    showMessage(
      movementType === "cash_in"
        ? "Cash In recorded."
        : "Cash Out recorded."
    );

    await refreshRegister();

  } catch (error) {

    console.error("Movement error:", error);

    alert(
      "Could not save cash movement.\n\n" +
      (error.message || "Unknown error")
    );
  }
}


function updateDifference() {

  const counted = Number(countedCashEl.value);

  if (!Number.isFinite(counted)) {
    differenceViewEl.textContent = money(0);
    return;
  }

  const difference =
    counted - currentExpectedCash;

  differenceViewEl.textContent =
    money(difference);
}


async function closeRegister() {

  if (!currentSession) {
    alert("There is no open register.");
    return;
  }

  const countedCash = Number(countedCashEl.value);

  if (!Number.isFinite(countedCash) || countedCash < 0) {
    alert("Enter the cash you counted in the drawer.");
    return;
  }

  const difference =
    countedCash - currentExpectedCash;

  const confirmed = confirm(
    "Close the register?\n\n" +
    "Expected: " + money(currentExpectedCash) + "\n" +
    "Counted: " + money(countedCash) + "\n" +
    "Difference: " + money(difference)
  );

  if (!confirmed) {
    return;
  }

  try {

    const {
      error
    } = await supabaseClient
      .from("cash_sessions")
      .update({
        closed_by: currentProfile.id,
        closed_at: new Date().toISOString(),
        expected_cash: currentExpectedCash,
        counted_cash: countedCash,
        difference: difference,
        notes: closeNotesEl.value.trim() || null,
        status: "closed"
      })
      .eq("id", currentSession.id)
      .eq("status", "open");

    if (error) {
      throw error;
    }

    showMessage(
      "Register closed successfully. End of day completed."
    );

    countedCashEl.value = "";
    closeNotesEl.value = "";

    currentSession = null;

    await refreshRegister();

  } catch (error) {

    console.error("Close register error:", error);

    alert(
      "Could not close the register.\n\n" +
      (error.message || "Unknown error")
    );
  }
}


openRegisterBtnEl.addEventListener(
  "click",
  openRegister
);

cashInBtnEl.addEventListener(
  "click",
  () => addMovement("cash_in")
);

cashOutBtnEl.addEventListener(
  "click",
  () => addMovement("cash_out")
);

countedCashEl.addEventListener(
  "input",
  updateDifference
);

closeRegisterBtnEl.addEventListener(
  "click",
  closeRegister
);


async function startCashoutPage() {

  currentProfile = await getCurrentProfile();

  if (!currentProfile) {
    alert("Could not load your user profile.");
    return;
  }

  await refreshRegister();
}

startCashoutPage();

</script>

</body>
</html>
