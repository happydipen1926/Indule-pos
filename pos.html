<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Checkout - Indulge Cafe POS</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="data.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</head>

<body>
  <div class="app-shell" id="shell"></div>

  <script>
    if (!App.requireLogin()) {
      throw new Error("login required");
    }

    document.getElementById("shell").innerHTML =
      App.shell("pos", "Checkout");

    document.getElementById("page").innerHTML = `
      <div class="checkout">

        <section class="catalog">

          <div class="searchrow">
            <input
              id="search"
              type="search"
              placeholder="Search menu items..."
              autocomplete="off"
            >

            <button id="customAmountBtn" class="btn">
              Custom amount
            </button>
          </div>

          <div id="tabs" class="tabs"></div>

          <div id="grid" class="item-grid"></div>

        </section>


        <aside class="cart">

          <div class="cart-head">
            <div>
              <div style="font-size:12px;opacity:.85">
                CURRENT ORDER
              </div>

              <strong>
                Order #<span id="orderno">Auto</span>
              </strong>
            </div>

            <button id="clearCartBtn" class="btn">
              Clear
            </button>
          </div>


          <div
            style="
              display:grid;
              grid-template-columns:1fr 1fr;
              gap:8px;
              margin-top:12px;
            "
          >
            <button id="dine" class="btn">
              Dine In
            </button>

            <button id="take" class="btn">
              Takeaway
            </button>
          </div>


          <div style="margin-top:12px">
            <label>
              Table / customer name
            </label>

            <input
              id="tableName"
              placeholder="Optional"
              autocomplete="off"
            >
          </div>


          <div id="cartList" class="cart-list"></div>


          <div class="quickbar">
            <button
              class="btn"
              data-discount="5"
            >
              5% off
            </button>

            <button
              class="btn"
              data-discount="10"
            >
              10% off
            </button>

            <button
              class="btn"
              data-discount="0"
            >
              No discount
            </button>
          </div>


          <div
            style="
              display:grid;
              grid-template-columns:1fr 1fr;
              gap:8px;
              margin-top:9px;
            "
          >
            <button id="holdBtn" class="btn">
              Save cart
            </button>

            <button id="recallBtn" class="btn">
              Recall cart
            </button>
          </div>


          <div class="totalbox">

            <div class="totalrow">
              <span>Subtotal</span>
              <strong id="subtotal">$0.00</strong>
            </div>

            <div class="totalrow">
              <span>Discount</span>
              <strong id="discountAmt">$0.00</strong>
            </div>

            <div class="totalrow grand">
              <span>Total</span>
              <strong id="total">$0.00</strong>
            </div>

          </div>


          <button id="charge" class="paybtn">
            Charge $0.00
          </button>

        </aside>

      </div>


      <div id="payModal" class="modal">

        <div class="modalbox">

          <div
            style="
              display:flex;
              align-items:center;
              justify-content:space-between;
              gap:10px;
            "
          >
            <h2 style="margin:0">
              Take payment
            </h2>

            <button id="closePayBtn" class="btn">
              Close
            </button>
          </div>


          <p class="muted">
            Choose how the customer paid.
          </p>


          <div class="paychoices">

            <button id="cashPayBtn">
              Cash
            </button>

            <button id="cardPayBtn">
              Card
            </button>

          </div>

        </div>

      </div>
    `;


    const ordernoEl = document.getElementById("orderno");
    const searchEl = document.getElementById("search");
    const tabsEl = document.getElementById("tabs");
    const gridEl = document.getElementById("grid");

    const dineEl = document.getElementById("dine");
    const takeEl = document.getElementById("take");

    const tableNameEl = document.getElementById("tableName");
    const cartListEl = document.getElementById("cartList");

    const subtotalEl = document.getElementById("subtotal");
    const discountAmtEl = document.getElementById("discountAmt");
    const totalEl = document.getElementById("total");
    const chargeEl = document.getElementById("charge");

    const payModalEl = document.getElementById("payModal");

    const clearCartBtnEl = document.getElementById("clearCartBtn");
    const customAmountBtnEl = document.getElementById("customAmountBtn");
    const holdBtnEl = document.getElementById("holdBtn");
    const recallBtnEl = document.getElementById("recallBtn");
    const closePayBtnEl = document.getElementById("closePayBtn");
    const cashPayBtnEl = document.getElementById("cashPayBtn");
    const cardPayBtnEl = document.getElementById("cardPayBtn");


    let cart = [];
    let type = "";
    let discount = 0;
    let activeCat = "Favorites";

    let cloudProducts = [];
    let cloudCategories = [];

    let paymentBusy = false;


    ordernoEl.textContent = "Auto";


    async function loadCloudMenu() {

      const {
        data: categoryData,
        error: categoryError
      } = await supabaseClient
        .from("categories")
        .select("id, name, active, sort_order")
        .eq("active", true)
        .order("sort_order", {
          ascending: true
        });


      if (categoryError) {
        console.error(
          "Category error:",
          categoryError
        );

        throw categoryError;
      }


      const {
        data: productData,
        error: productError
      } = await supabaseClient
        .from("products")
        .select(`
          id,
          name,
          price,
          active,
          favorite,
          sort_order,
          category_id,
          categories (
            id,
            name
          )
        `)
        .eq("active", true)
        .order("sort_order", {
          ascending: true
        });


      if (productError) {
        console.error(
          "Product error:",
          productError
        );

        throw productError;
      }


      cloudCategories =
        categoryData || [];


      cloudProducts =
        (productData || []).map(
          function (product) {

            return {
              id: product.id,
              name: product.name,
              price: Number(product.price),

              category:
                product.categories
                  ? product.categories.name
                  : "Other",

              favorite:
                product.favorite === true,

              active:
                product.active !== false
            };

          }
        );
    }


    function cats() {

      return [
        "Favorites",
        ...cloudCategories.map(
          category => category.name
        )
      ];
    }


    function renderTabs() {

      tabsEl.innerHTML = "";

      cats().forEach(
        function (categoryName) {

          const button =
            document.createElement("button");

          button.className =
            "tab" +
            (
              categoryName === activeCat
                ? " active"
                : ""
            );

          button.textContent =
            categoryName;

          button.onclick =
            function () {

              activeCat =
                categoryName;

              renderTabs();
              renderItems();
            };

          tabsEl.appendChild(
            button
          );
        }
      );
    }


    function renderItems() {

      const query =
        searchEl.value
          .trim()
          .toLowerCase();

      let products =
        cloudProducts.filter(
          product =>
            product.active !== false
        );


      if (
        activeCat ===
        "Favorites"
      ) {

        products =
          products.filter(
            product =>
              product.favorite === true
          );

      } else {

        products =
          products.filter(
            product =>
              product.category ===
              activeCat
          );
      }


      if (query) {

        products =
          products.filter(
            product =>
              product.name
                .toLowerCase()
                .includes(query)
          );
      }


      gridEl.innerHTML = "";


      if (!products.length) {

        gridEl.innerHTML =
          '<p class="muted">No items found.</p>';

        return;
      }


      products.forEach(
        function (product) {

          const button =
            document.createElement("button");

          button.className =
            "tile";

          button.innerHTML = `
            <span class="cat">
              ${escapeHtml(product.category)}
            </span>

            <span class="name">
              ${escapeHtml(product.name)}
            </span>

            <span class="price">
              ${App.money(product.price)}
            </span>
          `;

          button.onclick =
            function () {
              add(product);
            };

          gridEl.appendChild(
            button
          );
        }
      );
    }


    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function add(product) {

      const existing =
        cart.find(
          item =>
            item.id === product.id
        );


      if (existing) {

        existing.qty++;

      } else {

        cart.push({
          id: product.id,
          name: product.name,
          price: Number(product.price),
          category: product.category,
          qty: 1
        });
      }


      renderCart();
    }


    function customAmount() {

      const amount =
        Number(
          prompt(
            "Custom amount"
          )
        );


      if (
        Number.isFinite(amount) &&
        amount > 0
      ) {

        cart.push({
          id:
            "custom-" +
            Date.now(),

          name:
            "Custom amount",

          price:
            amount,

          category:
            "Custom",

          qty:
            1
        });

        renderCart();
      }
    }


    function setType(newType) {

      type =
        newType;

      dineEl.classList.toggle(
        "btn-dark",
        newType === "Dine In"
      );

      takeEl.classList.toggle(
        "btn-dark",
        newType === "Takeaway"
      );
    }


    function renderCart() {

      cartListEl.innerHTML =
        "";

      let sub =
        0;


      if (!cart.length) {

        cartListEl.innerHTML =
          '<p class="muted">Tap an item to add it.</p>';
      }


      cart.forEach(
        function (item, index) {

          sub +=
            Number(item.price) *
            Number(item.qty);


          const line =
            document.createElement(
              "div"
            );

          line.className =
            "cart-line";

          line.innerHTML = `
            <div class="row">
              <b>${escapeHtml(item.name)}</b>
              <span>
                ${App.money(
                  Number(item.price) *
                  Number(item.qty)
                )}
              </span>
            </div>

            <div class="qty">

              <button
                type="button"
                onclick="qty(${index},-1)"
              >
                −
              </button>

              <span>
                ${item.qty}
              </span>

              <button
                type="button"
                onclick="qty(${index},1)"
              >
                +
              </button>

              <button
                type="button"
                class="btn"
                style="
                  padding:4px 8px;
                  margin-left:auto
                "
                onclick="removeLine(${index})"
              >
                Remove
              </button>

            </div>
          `;

          cartListEl.appendChild(
            line
          );
        }
      );


      const discountValue =
        sub *
        Number(discount || 0) /
        100;

      const finalTotal =
        sub -
        discountValue;


      subtotalEl.textContent =
        App.money(sub);

      discountAmtEl.textContent =
        App.money(
          discountValue
        );

      totalEl.textContent =
        App.money(
          finalTotal
        );

      chargeEl.textContent =
        "Charge " +
        App.money(
          finalTotal
        );
    }


    function qty(index, change) {

      if (!cart[index]) {
        return;
      }

      cart[index].qty +=
        change;


      if (
        cart[index].qty <= 0
      ) {

        cart.splice(
          index,
          1
        );
      }


      renderCart();
    }


    function removeLine(index) {

      cart.splice(
        index,
        1
      );

      renderCart();
    }


    function applyDiscount(percent) {

      discount =
        Number(percent || 0);

      renderCart();
    }


    function clearCart() {

      if (
        !cart.length ||
        confirm(
          "Clear current sale?"
        )
      ) {

        cart = [];
        discount = 0;
        type = "";

        tableNameEl.value =
          "";

        dineEl.classList.remove(
          "btn-dark"
        );

        takeEl.classList.remove(
          "btn-dark"
        );

        renderCart();
      }
    }


    function holdSale() {

      if (!cart.length) {

        alert(
          "Nothing to save."
        );

        return;
      }


      const held =
        App.held();


      held.push({
        id:
          App.nextId(
            held
          ),

        name:
          tableNameEl.value.trim() ||
          (
            "Saved cart " +
            new Date()
              .toLocaleTimeString()
          ),

        cart:
          cart.map(
            item => ({
              ...item
            })
          ),

        discount:
          discount,

        type:
          type,

        tableName:
          tableNameEl.value.trim()
      });


      App.saveHeld(
        held
      );

      alert(
        "Cart saved."
      );

      clearCart();
    }


    function recallSale() {

      let held =
        App.held();


      if (!held.length) {

        alert(
          "No saved carts."
        );

        return;
      }


      const message =
        held
          .map(
            item =>
              `${item.id}: ${item.name}`
          )
          .join("\n");


      const id =
        Number(
          prompt(
            "Enter saved cart number:\n" +
            message
          )
        );


      const saved =
        held.find(
          item =>
            item.id === id
        );


      if (!saved) {
        return;
      }


      cart =
        (saved.cart || [])
          .map(
            item => ({
              ...item
            })
          );

      discount =
        Number(
          saved.discount || 0
        );

      type =
        saved.type || "";

      tableNameEl.value =
        saved.tableName || "";


      setType(
        type
      );


      held =
        held.filter(
          item =>
            item.id !== id
        );


      App.saveHeld(
        held
      );

      renderCart();
    }


    function openPay() {

      if (!cart.length) {

        alert(
          "Add items first."
        );

        return;
      }


      if (!type) {

        alert(
          "Choose Dine In or Takeaway."
        );

        return;
      }


      payModalEl.classList.add(
        "show"
      );
    }


    function closePay() {

      payModalEl.classList.remove(
        "show"
      );
    }


    async function getCurrentProfile() {

      const {
        data: { user },
        error: userError
      } =
        await supabaseClient
          .auth
          .getUser();


      if (
        userError ||
        !user
      ) {

        console.error(
          "User error:",
          userError
        );

        return null;
      }


      const {
        data: profile,
        error: profileError
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "id, business_id, full_name, role, active"
          )
          .eq(
            "id",
            user.id
          )
          .single();


      if (profileError) {

        console.error(
          "Profile error:",
          profileError
        );

        return null;
      }


      if (
        profile.active === false
      ) {

        alert(
          "This POS user is disabled."
        );

        return null;
      }


      return profile;
    }


    async function finish(method) {

      if (paymentBusy) {
        return;
      }


      if (!cart.length) {

        alert(
          "There are no items in the cart."
        );

        return;
      }


      if (!type) {

        alert(
          "Please choose Dine In or Takeaway."
        );

        return;
      }


      paymentBusy = true;


      try {

        const profile =
          await getCurrentProfile();


        if (!profile) {

          alert(
            "Could not identify the logged-in user."
          );

          return;
        }


        const subtotal =
          cart.reduce(
            function (
              runningTotal,
              item
            ) {

              return (
                runningTotal +
                Number(item.price) *
                Number(item.qty)
              );
            },
            0
          );


        const discountPercent =
          Number(
            discount || 0
          );


        const discountAmount =
          subtotal *
          discountPercent /
          100;


        const finalTotal =
          subtotal -
          discountAmount;


        const customerOrTable =
          tableNameEl.value.trim();


        const {
          data: order,
          error: orderError
        } =
          await supabaseClient
            .from("orders")
            .insert({
              business_id:
                profile.business_id,

              order_type:
                type,

              payment_method:
                method,

              subtotal:
                subtotal,

              discount_percent:
                discountPercent,

              discount_amount:
                discountAmount,

              total:
                finalTotal,

              table_name:
                type === "Dine In"
                  ? customerOrTable || null
                  : null,

              customer_name:
                type === "Takeaway"
                  ? customerOrTable || null
                  : null,

              created_by:
                profile.id,

              status:
                "pending"
            })
            .select()
            .single();


        if (orderError) {

          console.error(
            "Order save error:",
            orderError
          );

          alert(
            "Order could not be saved.\n\n" +
            orderError.message
          );

          return;
        }


        const itemRows =
          cart.map(
            function (item) {

              return {
                order_id:
                  order.id,

                product_id:
                  typeof item.id ===
                  "number"
                    ? item.id
                    : null,

                product_name:
                  item.name,

                category_name:
                  item.category || null,

                unit_price:
                  Number(item.price),

                quantity:
                  Number(item.qty),

                line_total:
                  Number(item.price) *
                  Number(item.qty)
              };
            }
          );


        const {
          error: itemsError
        } =
          await supabaseClient
            .from("order_items")
            .insert(
              itemRows
            );


        if (itemsError) {

          console.error(
            "Order items error:",
            itemsError
          );


          await supabaseClient
            .from("orders")
            .update({
              status:
                "failed"
            })
            .eq(
              "id",
              order.id
            );


          alert(
            "Order was created, but its items could not be saved.\n\n" +
            itemsError.message +
            "\n\nThe cart has not been cleared."
          );

          return;
        }


        const {
          error: completeError
        } =
          await supabaseClient
            .from("orders")
            .update({
              status:
                "completed"
            })
            .eq(
              "id",
              order.id
            );


        if (completeError) {

          console.error(
            "Complete order error:",
            completeError
          );

          alert(
            "Order and items were saved, but the order could not be marked completed.\n\n" +
            completeError.message
          );

          return;
        }


        closePay();


        alert(
          "Payment recorded successfully\n\n" +
          "Order #" +
          (
            order.order_number ||
            order.id
          ) +
          "\n" +
          method +
          "\n" +
          App.money(
            finalTotal
          )
        );


        cart = [];
        discount = 0;
        type = "";

        tableNameEl.value =
          "";

        dineEl.classList.remove(
          "btn-dark"
        );

        takeEl.classList.remove(
          "btn-dark"
        );

        renderCart();

        ordernoEl.textContent =
          "Auto";


      } catch (error) {

        console.error(
          "Checkout error:",
          error
        );


        alert(
          "Something went wrong while saving the order.\n\n" +
          "Your cart has not been cleared."
        );

      } finally {

        paymentBusy = false;
      }
    }


    async function startPOS() {

      try {

        await loadCloudMenu();

        renderTabs();
        renderItems();
        renderCart();

      } catch (error) {

        console.error(
          "Cloud menu failed:",
          error
        );

        alert(
          "Could not load the cloud menu. Please check your internet connection and Supabase."
        );

        renderCart();
      }
    }


    searchEl.addEventListener(
      "input",
      renderItems
    );

    customAmountBtnEl.addEventListener(
      "click",
      customAmount
    );

    dineEl.addEventListener(
      "click",
      function () {
        setType(
          "Dine In"
        );
      }
    );

    takeEl.addEventListener(
      "click",
      function () {
        setType(
          "Takeaway"
        );
      }
    );

    clearCartBtnEl.addEventListener(
      "click",
      clearCart
    );

    holdBtnEl.addEventListener(
      "click",
      holdSale
    );

    recallBtnEl.addEventListener(
      "click",
      recallSale
    );

    chargeEl.addEventListener(
      "click",
      openPay
    );

    closePayBtnEl.addEventListener(
      "click",
      closePay
    );

    cashPayBtnEl.addEventListener(
      "click",
      function () {
        finish(
          "Cash"
        );
      }
    );

    cardPayBtnEl.addEventListener(
      "click",
      function () {
        finish(
          "Card"
        );
      }
    );

    document
      .querySelectorAll(
        "[data-discount]"
      )
      .forEach(
        function (button) {

          button.addEventListener(
            "click",
            function () {

              applyDiscount(
                Number(
                  button.dataset.discount
                )
              );
            }
          );
        }
      );


    window.qty =
      qty;

    window.removeLine =
      removeLine;


    startPOS();

  </script>

</body>
</html>
