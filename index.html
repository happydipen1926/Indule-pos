<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indulge Cafe POS</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:Arial,sans-serif; background:#f4f4f4; color:#222; }
    header { background:#222; color:#fff; padding:16px; text-align:center; position:sticky; top:0; z-index:10; }
    header h1 { margin:0 0 6px; }
    nav { margin-top:10px; }
    nav a { color:#fff; text-decoration:none; border:1px solid #777; padding:8px 12px; border-radius:6px; margin:0 4px; }
    .layout { display:grid; grid-template-columns:2fr 1fr; gap:16px; padding:16px; }
    .panel { background:#fff; border-radius:12px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    button { cursor:pointer; }
    .order-type button, .categories button, .payment button, .action-btn {
      padding:12px 16px; margin:4px; border:1px solid #aaa; border-radius:8px; background:#fff; font-size:16px;
    }
    .selected { background:#222 !important; color:#fff !important; border-color:#222 !important; }
    .categories { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
    .products { display:grid; grid-template-columns:repeat(3,minmax(140px,1fr)); gap:10px; }
    .product {
      border:1px solid #ccc; background:#fff; border-radius:10px; min-height:95px; padding:14px;
      font-size:16px; display:flex; flex-direction:column; justify-content:center; align-items:center;
    }
    .product strong { margin-top:8px; font-size:18px; }
    .cart-row { border-bottom:1px solid #e5e5e5; padding:10px 0; }
    .qty-btn, .remove-btn { padding:5px 9px; margin:4px; }
    .total { font-size:26px; font-weight:bold; margin-top:16px; }
    .cash { background:#eaf7ea !important; }
    .card { background:#eaf1ff !important; }
    .danger { background:#ffecec !important; }
    .muted { color:#666; }
    @media (max-width:900px){
      .layout{ grid-template-columns:1fr; }
      .products{ grid-template-columns:repeat(2,1fr); }
    }
  </style>
</head>
<body>

<header>
  <h1>Indulge Cafe POS</h1>
  <div>Order #<span id="orderNumber">1</span></div>
  <nav><a href="admin.html">Admin / Edit Menu</a></nav>
</header>

<div class="layout">
  <section class="panel">
    <h2>Order Type</h2>
    <div class="order-type">
      <button id="dineBtn" onclick="setOrderType('Dine In')">Dine In</button>
      <button id="takeBtn" onclick="setOrderType('Takeaway')">Takeaway</button>
    </div>
    <p>Selected: <strong id="orderTypeDisplay">Not selected</strong></p>

    <h2>Categories</h2>
    <div class="categories" id="categoryButtons"></div>

    <h2>Products</h2>
    <div id="products" class="products"></div>
  </section>

  <aside class="panel">
    <h2>Order</h2>
    <div id="cartItems"><p class="muted">No items yet.</p></div>
    <div class="total">Total: $<span id="total">0.00</span></div>

    <div class="payment" style="margin-top:16px;">
      <button class="cash" onclick="pay('Cash')">Cash</button>
      <button class="card" onclick="pay('Card')">Card</button>
    </div>

    <button class="action-btn danger" onclick="clearOrder()">Clear Order</button>
    <button class="action-btn" onclick="printReceipt()">Print Receipt</button>
  </aside>
</div>

function getProducts(){
  const stored = localStorage.getItem("indulgeProducts");
  if(stored){
    try { return JSON.parse(stored); } catch(e){}
  }
  localStorage.setItem("indulgeProducts", JSON.stringify(DEFAULT_PRODUCTS));
  return DEFAULT_PRODUCTS;
}

let products = getProducts();
let cart = [];
let orderType = "";
let orderNumber = Number(localStorage.getItem("orderNumber") || 1);
document.getElementById("orderNumber").textContent = orderNumber;

function renderCategories(){
  products = getProducts();
  const activeProducts = products.filter(p => p.active !== false);
  const categories = [...new Set(activeProducts.map(p => p.category))];
  const wrap = document.getElementById("categoryButtons");
  wrap.innerHTML = "";
  categories.forEach((category, i) => {
    const btn = document.createElement("button");
    btn.textContent = category;
    btn.onclick = () => showCategory(category);
    wrap.appendChild(btn);
  });
  if(categories.length) showCategory(categories[0]);
  else document.getElementById("products").innerHTML = '<p class="muted">No active products.</p>';
}

function showCategory(category){
  products = getProducts();
  const area = document.getElementById("products");
  area.innerHTML = "";
  const filtered = products.filter(p => p.category === category && p.active !== false);
  filtered.forEach(product => {
    const button = document.createElement("button");
    button.className = "product";
    button.innerHTML = `${product.name}<strong>$${Number(product.price).toFixed(2)}</strong>`;
    button.onclick = () => addToCart(product);
    area.appendChild(button);
  });
}

function setOrderType(type){
  orderType = type;
  document.getElementById("orderTypeDisplay").textContent = type;
  document.getElementById("dineBtn").classList.toggle("selected", type === "Dine In");
  document.getElementById("takeBtn").classList.toggle("selected", type === "Takeaway");
}

function addToCart(product){
  const existing = cart.find(i => i.id === product.id);
  if(existing) existing.quantity++;
  else cart.push({id:product.id,name:product.name,price:Number(product.price),quantity:1});
  updateCart();
}

function updateCart(){
  const area = document.getElementById("cartItems");
  area.innerHTML = "";
  let total = 0;
  if(!cart.length) area.innerHTML = '<p class="muted">No items yet.</p>';
  cart.forEach((item,index) => {
    total += item.price * item.quantity;
    const row = document.createElement("div");
    row.className = "cart-row";
    row.innerHTML = `
      <strong>${item.name}</strong><br>
      $${item.price.toFixed(2)}
      <button class="qty-btn" onclick="decrease(${index})">-</button>
      ${item.quantity}
      <button class="qty-btn" onclick="increase(${index})">+</button>
      = $${(item.price*item.quantity).toFixed(2)}
      <button class="remove-btn" onclick="removeItem(${index})">Remove</button>`;
    area.appendChild(row);
  });
  document.getElementById("total").textContent = total.toFixed(2);
}

function increase(index){ cart[index].quantity++; updateCart(); }
function decrease(index){ cart[index].quantity--; if(cart[index].quantity<=0) cart.splice(index,1); updateCart(); }
function removeItem(index){ cart.splice(index,1); updateCart(); }
function clearOrder(){ if(confirm("Clear the whole order?")){ cart=[]; updateCart(); } }

function pay(method){
  if(!cart.length){ alert("Please add items first."); return; }
  if(!orderType){ alert("Please select Dine In or Takeaway."); return; }

  const total = document.getElementById("total").textContent;
  const sales = JSON.parse(localStorage.getItem("indulgeSales") || "[]");
  sales.push({
    orderNumber,
    orderType,
    paymentMethod: method,
    total: Number(total),
    items: cart,
    date: new Date().toISOString()
  });
  localStorage.setItem("indulgeSales", JSON.stringify(sales));

  alert(`Order #${orderNumber}\n${orderType}\nPayment: ${method}\nTotal: $${total}`);

  orderNumber++;
  localStorage.setItem("orderNumber", orderNumber);
  document.getElementById("orderNumber").textContent = orderNumber;
  cart=[];
  orderType="";
  document.getElementById("orderTypeDisplay").textContent="Not selected";
  document.getElementById("dineBtn").classList.remove("selected");
  document.getElementById("takeBtn").classList.remove("selected");
  updateCart();
}

function printReceipt(){
  if(!cart.length){ alert("Add items before printing."); return; }
  window.print();
}

renderCategories();
updateCart();

window.addEventListener("storage", () => renderCategories());
</script>
