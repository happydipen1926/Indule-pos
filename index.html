<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Indulge POS Login</title>
  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
</head>
<body>
<div class="container">
  <div class="login">
    <div class="card">
      <h1>Indulge POS</h1>
      <p class="muted">Sign in to continue</p>
      <div id="msg"></div>

      <label>Email</label>
      <input id="loginEmail" type="email" placeholder="you@example.com">

      <label style="margin-top:10px">Password</label>
      <input id="loginPassword" type="password">

      <button id="loginBtn" class="btn btn-dark" style="width:100%;margin-top:14px">
        Sign in
      </button>

      <p style="text-align:center">
        New account? <a href="register.html"><b>Create account</b></a>
      </p>
    </div>

    <div class="notice">
      This version stores login and POS data in this browser only.
      Use Backup regularly. For multi-device use, connect a cloud database later.
    </div>
  </div>
</div>

<script>
document.getElementById("loginBtn").addEventListener("click", login);

document.getElementById("loginPassword").addEventListener("keydown", function(event) {
  if (event.key === "Enter") login();
});

function showMessage(text) {
  document.getElementById("msg").innerHTML =
    '<div class="notice">' + text + '</div>';
}

async function login() {

  const email =
    document.getElementById("loginEmail")
      .value
      .trim()
      .toLowerCase();

  const password =
    document.getElementById("loginPassword")
      .value;

  if (!email || !password) {
    showMessage("Please enter your email and password.");
    return;
  }

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

 if (error) {
  console.error(error);

  showMessage(
    "Login failed: " + error.message
  );

  return;
}

  const user = data.user;

  const { data: profile, error: profileError } =
    await supabaseClient
      .from("profiles")
      .select(
        "id, business_id, full_name, role, active"
      )
      .eq("id", user.id)
      .single();

  if (profileError) {
    console.error(profileError);

    showMessage(
      "Login worked, but your POS profile could not be loaded."
    );

    return;
  }

  if (profile.active === false) {
    await supabaseClient.auth.signOut();

    showMessage(
      "This account is disabled."
    );

    return;
  }

  localStorage.setItem(
    "sqpos_session",
    JSON.stringify({
      id: profile.id,
      name: profile.full_name,
      email: user.email,
      role: profile.role,
      business_id: profile.business_id
    })
  );

  window.location.href = "dashboard.html";
}
</script>
</body>
</html>
