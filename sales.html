<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports</title>
<link rel="stylesheet" href="styles.css"><script src="data.js"></script><script src="config.js"></script><script src="app.js"></script></head><body><div class="app-shell" id="shell"></div><script>if(!App.requireAdmin()) throw new Error("admin required");

document.getElementById("shell").innerHTML=App.shell("sales", "Reports");
document.getElementById("page").innerHTML=`
<div class="container"><div class="card"><h2>Reports</h2><div class="toolbar"><div><label>From</label><input id="from" type="date"></div><div><label>To</label><input id="to" type="date"></div><div style="flex:0"><label>&nbsp;</label><button class="btn" onclick="today()">Today</button></div><div style="flex:0"><label>&nbsp;</label><button class="btn" onclick="month()">Month</button></div><div style="flex:0"><label>&nbsp;</label><button class="btn btn-dark" onclick="render()">Apply</button></div></div></div>
<div class="grid g4"><div class="stat"><div class="k">Sales</div><div class="v" id="tot">$0</div></div><div class="stat"><div class="k">Cash</div><div class="v" id="cash">$0</div></div><div class="stat"><div class="k">Card</div><div class="v" id="card">$0</div></div><div class="stat"><div class="k">Orders / Avg</div><div class="v"><span id="count">0</span> / <span id="avg">$0</span></div></div></div>
<div class="grid g2"><div class="card"><h3>Top items</h3><table><thead><tr><th>Item</th><th>Qty</th><th>Sales</th></tr></thead><tbody id="prows"></tbody></table></div><div class="card"><h3>By category</h3><table><thead><tr><th>Category</th><th>Qty</th><th>Sales</th></tr></thead><tbody id="crows"></tbody></table></div></div>
<div class="card"><button class="btn" onclick="csv()">Export CSV</button> <button class="btn" onclick="window.print()">Print</button></div></div>
`;

function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0')}function today(){let d=new Date();from.value=to.value=iso(d);render()}function month(){let d=new Date();from.value=iso(new Date(d.getFullYear(),d.getMonth(),1));to.value=iso(d);render()}function filt(){return App.orders().filter(o=>{let d=String(o.createdAt).slice(0,10);return(!from.value||d>=from.value)&&(!to.value||d<=to.value)})}
function render(){let os=filt(),t=os.reduce((n,o)=>n+Number(o.total||0),0),ca=os.filter(o=>o.paymentMethod==='Cash').reduce((n,o)=>n+Number(o.total||0),0),cd=os.filter(o=>o.paymentMethod==='Card').reduce((n,o)=>n+Number(o.total||0),0);tot.textContent=App.money(t);cash.textContent=App.money(ca);card.textContent=App.money(cd);count.textContent=os.length;avg.textContent=App.money(os.length?t/os.length:0);let ps={},cs={};os.forEach(o=>(o.items||[]).forEach(i=>{ps[i.name]=ps[i.name]||{q:0,s:0};ps[i.name].q+=i.qty;ps[i.name].s+=i.qty*i.price;let c=i.category||'Other';cs[c]=cs[c]||{q:0,s:0};cs[c].q+=i.qty;cs[c].s+=i.qty*i.price}));prows.innerHTML='';Object.entries(ps).sort((a,b)=>b[1].q-a[1].q).forEach(([n,v])=>{let tr=document.createElement('tr');tr.innerHTML=`<td>${n}</td><td>${v.q}</td><td>${App.money(v.s)}</td>`;prows.appendChild(tr)});crows.innerHTML='';Object.entries(cs).sort((a,b)=>b[1].s-a[1].s).forEach(([n,v])=>{let tr=document.createElement('tr');tr.innerHTML=`<td>${n}</td><td>${v.q}</td><td>${App.money(v.s)}</td>`;crows.appendChild(tr)})}
function csv(){let os=filt(),rows=[['Order','Date','Type','Payment','Total','Items']];os.forEach(o=>rows.push([o.orderNumber,new Date(o.createdAt).toLocaleString(),o.orderType,o.paymentMethod,Number(o.total).toFixed(2),(o.items||[]).map(i=>`${i.qty}x ${i.name}`).join(' | ')]));let txt=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n'),b=new Blob([txt],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='indulge-sales.csv';a.click();URL.revokeObjectURL(u)}
month();
</script></body></html>
