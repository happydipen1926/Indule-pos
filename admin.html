<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,sans-serif; background:#f4f4f4; color:#222; }
    header { background:#222; color:white; padding:18px; text-align:center; }
    header a { color:white; text-decoration:none; border:1px solid #777; padding:8px 12px; border-radius:6px; display:inline-block; margin-top:8px; }
    .container { max-width:1100px; margin:auto; padding:18px; }
    .card { background:white; border-radius:12px; padding:18px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    .grid { display:grid; grid-template-columns:2fr 1.2fr 1fr auto; gap:10px; align-items:end; }
    input, select { width:100%; padding:10px; font-size:16px; border:1px solid #bbb; border-radius:7px; }
    button { padding:10px 14px; border:1px solid #aaa; border-radius:7px; cursor:pointer; }
    .primary { background:#222; color:#fff; }
    .danger { background:#ffe7e7; }
    .success { background:#e8f7e8; }
    table { width:100%; border-collapse:collapse; }
    th,td { text-align:left; padding:10px; border-bottom:1px solid #ddd; vertical-align:middle; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .toolbar input { max-width:320px; }
    .small { font-size:13px; color:#666; }
    @media(max-width:800px){
      .grid { grid-template-columns:1fr; }
      table,thead,tbody,tr,td,th { display:block; }
      thead { display:none; }
      tr { border:1px solid #ddd; margin-bottom:10px; padding:8px; border-radius:8px; }
      td { border:0; padding:6px; }
    }
  </style>
</head>
<body>

<header>
  <h1>Indulge Cafe POS Admin</h1>
  <a href="index.html">← Back to POS</a>
</header>

<div class="container">

  <div class="card">
    <h2>Add New Product</h2>
    <div class="grid">
      <div>
        <label>Product name</label>
        <input id="newName" placeholder="e.g. Flat White">
      </div>
      <div>
        <label>Category</label>
        <input id="newCategory" placeholder="e.g. Coffee">
      </div>
      <div>
        <label>Price</label>
        <input id="newPrice" type="number" step="0.01" min="0" placeholder="5.50">
      </div>
      <button class="primary" onclick="addProduct()">Add Product</button>
    </div>
  </div>

  <div class="card">
    <h2>Manage Products</h2>

    <div class="toolbar">
      <input id="search" placeholder="Search products..." oninput="renderProducts()">
      <select id="filterCategory" onchange="renderProducts()">
        <option value="">All Categories</option>
      </select>
      <button onclick="exportMenu()">Export Backup</button>
      <button onclick="document.getElementById('importFile').click()">Import Backup</button>
      <input id="importFile" type="file" accept=".json" style="display:none" onchange="importMenu(event)">
      <button class="danger" onclick="resetMenu()">Reset Menu</button>
    </div>

    <div class="small">Changes are saved automatically in this browser. They will appear on the POS page immediately after refresh.</div>

    <div style="overflow-x:auto;margin-top:12px;">
      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>Category</th>
            <th>Price</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="productRows"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2>Sales Summary</h2>
    <p>Total recorded orders: <strong id="salesCount">0</strong></p>
    <p>Total recorded sales: <strong>$<span id="salesTotal">0.00</span></strong></p>
    <button class="danger" onclick="clearSales()">Clear Sales History</button>
  </div>

</div>

function getProducts(){
  const stored = localStorage.getItem("indulgeProducts");
  if(stored){
    try { return JSON.parse(stored); } catch(e){}
  }
  localStorage.setItem("indulgeProducts", JSON.stringify(DEFAULT_PRODUCTS));
  return [...DEFAULT_PRODUCTS];
}
function saveProducts(products){
  localStorage.setItem("indulgeProducts", JSON.stringify(products));
}

function addProduct(){
  const name = document.getElementById("newName").value.trim();
  const category = document.getElementById("newCategory").value.trim();
  const price = Number(document.getElementById("newPrice").value);
  if(!name || !category || Number.isNaN(price)){ alert("Please enter product name, category and price."); return; }

  const products = getProducts();
  const nextId = products.length ? Math.max(...products.map(p => Number(p.id)||0)) + 1 : 1;
  products.push({id:nextId, name, category, price, active:true});
  saveProducts(products);

  document.getElementById("newName").value="";
  document.getElementById("newCategory").value="";
  document.getElementById("newPrice").value="";
  renderAll();
}

function editProduct(id){
  const products = getProducts();
  const p = products.find(x => x.id === id);
  if(!p) return;

  const name = prompt("Product name:", p.name);
  if(name === null) return;
  const category = prompt("Category:", p.category);
  if(category === null) return;
  const priceText = prompt("Price:", p.price);
  if(priceText === null) return;
  const price = Number(priceText);
  if(!name.trim() || !category.trim() || Number.isNaN(price)){ alert("Invalid details."); return; }

  p.name = name.trim();
  p.category = category.trim();
  p.price = price;
  saveProducts(products);
  renderAll();
}

function toggleProduct(id){
  const products = getProducts();
  const p = products.find(x => x.id === id);
  if(!p) return;
  p.active = p.active === false ? true : false;
  saveProducts(products);
  renderAll();
}

function deleteProduct(id){
  if(!confirm("Delete this product permanently?")) return;
  let products = getProducts();
  products = products.filter(p => p.id !== id);
  saveProducts(products);
  renderAll();
}

function renderCategoryFilter(){
  const products = getProducts();
  const cats = [...new Set(products.map(p=>p.category))].sort();
  const select = document.getElementById("filterCategory");
  const current = select.value;
  select.innerHTML = '<option value="">All Categories</option>';
  cats.forEach(c=>{
    const opt = document.createElement("option");
    opt.value=c; opt.textContent=c;
    select.appendChild(opt);
  });
  if(cats.includes(current)) select.value=current;
}

function renderProducts(){
  const products = getProducts();
  const q = document.getElementById("search").value.trim().toLowerCase();
  const cat = document.getElementById("filterCategory").value;
  const rows = document.getElementById("productRows");
  rows.innerHTML="";

  products
    .filter(p => (!q || p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q)) && (!cat || p.category===cat))
    .sort((a,b)=>a.category.localeCompare(b.category) || a.name.localeCompare(b.name))
    .forEach(p=>{
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${p.name}</td>
        <td>${p.category}</td>
        <td>$${Number(p.price).toFixed(2)}</td>
        <td>${p.active===false ? "Unavailable" : "Available"}</td>
        <td>
          <button onclick="editProduct(${p.id})">Edit</button>
          <button class="${p.active===false ? 'success' : ''}" onclick="toggleProduct(${p.id})">
            ${p.active===false ? 'Make Available' : 'Make Unavailable'}
          </button>
          <button class="danger" onclick="deleteProduct(${p.id})">Delete</button>
        </td>`;
      rows.appendChild(tr);
    });
}

function renderSales(){
  const sales = JSON.parse(localStorage.getItem("indulgeSales") || "[]");
  document.getElementById("salesCount").textContent = sales.length;
  const total = sales.reduce((sum,s)=>sum + Number(s.total||0),0);
  document.getElementById("salesTotal").textContent = total.toFixed(2);
}

function clearSales(){
  if(confirm("Clear all sales history saved in this browser?")){
    localStorage.setItem("indulgeSales","[]");
    renderSales();
  }
}

function exportMenu(){
  const data = {
    products:getProducts(),
    sales:JSON.parse(localStorage.getItem("indulgeSales") || "[]"),
    exportedAt:new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url;
  a.download="indulge-pos-backup.json";
  a.click();
  URL.revokeObjectURL(url);
}

function importMenu(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data.products)) throw new Error("No products found");
      localStorage.setItem("indulgeProducts", JSON.stringify(data.products));
      if(Array.isArray(data.sales)) localStorage.setItem("indulgeSales", JSON.stringify(data.sales));
      alert("Backup imported successfully.");
      renderAll();
    }catch(e){
      alert("Could not import this backup file.");
    }
  };
  reader.readAsText(file);
}

function resetMenu(){
  if(confirm("Reset all products to the original menu? Your edits will be lost.")){
    localStorage.setItem("indulgeProducts", JSON.stringify(DEFAULT_PRODUCTS));
    renderAll();
  }
}

function renderAll(){
  renderCategoryFilter();
  renderProducts();
  renderSales();
}
renderAll();
